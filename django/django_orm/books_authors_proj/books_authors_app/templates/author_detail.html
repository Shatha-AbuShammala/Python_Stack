<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{author.first_name}}{{author.last_name}}</title>
</head>
<body>
    <h1>{{author.first_name}}{{author.last_name}}</h1>
    <p>ID:{{author.id}}</p>
    <p>Notes:{{author.notes}}</p>
    <h2>Books</h2>
    {% for book in author.books.all %}
    <li>{{book.title}}</li>
    {% endfor%}

    <h3>Add Book</h3>

<form method="POST">
    {% csrf_token %}

    <select name="book_id">
        {% for book in books %}
            <option value="{{ book.id }}">
                {{ book.title }}
            </option>
        {% endfor %}
    </select>

    <button>Add</button>
</form>
</body>
</html>
